<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Tracker Kuliah</h1>
      <p class="subtitle">Kelola tugas kuliahmu dengan mudah.</p>
    </header>

    <section class="task-section card">
      <table class="task-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Judul Tugas</th>
            <th>Mata Kuliah</th>
            <th>Deadline</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="list-tugas">
          <tr><td colspan="5">Memuat data...</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
