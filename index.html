<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Tracker Kuliah</h1>
      <p class="subtitle">Kelola tugas kuliahmu dengan mudah.</p>
    </header>

    <form id="form-tugas" class="card form-card">
    <div class="form-group">
        <label for="judul">Judul Tugas</label>
        <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)" required minlength="3">
    </div>

    <div class="form-row">
        <div class="form-group">
        <label for="matkul">Mata Kuliah</label>
        <select id="matkul" required>
            <option value="" disabled selected>Pilih mata kuliah</option>
            <option value="1">Pemrograman Web</option>
            <option value="2">Interaksi Manusia & Komputer</option>
            <option value="3">Struktur Data</option>
        </select>
        </div>

        <div class="form-group">
        <label for="deadline">Deadline</label>
        <input type="date" id="deadline" required>
        </div>
    </div>

    <button type="submit" class="btn-primary">Tambah Tugas</button>
    </form>

    <section class="task-section card">
      <table class="task-table">
        <thead>
          <tr>
            <th>No</th>
            <th>Judul Tugas</th>
            <th>Mata Kuliah</th>
            <th>Deadline</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="list-tugas">
          <tr><td colspan="5">Memuat data...</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
