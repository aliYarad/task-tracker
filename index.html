<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📋 Task Tracker Kuliah</h1>
    </header>

    <form id="form-tugas" class="card form-card">
      <div class="form-group">
        <label for="judul">Judul Tugas</label>
        <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)" required minlength="3">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="matkul">Mata Kuliah</label>
          <select id="matkul" required>
            <option value="" disabled selected>Pilih mata kuliah</option>
          </select>
        </div>

        <div class="form-group">
          <label for="deadline">Deadline</label>
          <input type="date" id="deadline" required>
        </div>
      </div>

      <button type="submit" class="btn-primary">Tambah Tugas</button>
    </form>

    <div class="controls-bar">
      <div class="filter-group">
        <button class="btn-filter active" data-filter="Semua">Semua</button>
        <button class="btn-filter" data-filter="Not Started">Not Started</button>
        <button class="btn-filter" data-filter="In Progress">In Progress</button>
        <button class="btn-filter" data-filter="Done">Done</button>
      </div>
      <div class="stats" id="stats-counter">0 tugas</div>
    </div>

    <section class="task-section card">
      <div class="table-responsive">
        <table class="task-table">
          <thead>
            <tr>
              <th>No</th>
              <th>Judul Tugas</th>
              <th>Mata Kuliah</th>
              <th>Deadline</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="list-tugas">
            <tr><td colspan="6" class="skeleton">Memuat data dari server...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
